
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #111114;
      --surface: #19191e;
      --text: #eee8e5;
      --muted: #99919a;
      --rose: #bd8494;
      --line: #343039;
      --accent: #815260;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 80% 15%, #442732 0%, transparent 35%),
        radial-gradient(ellipse at 10% 85%, #25212d 0%, transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .orb {
      position: absolute;
      width: 230px;
      height: 230px;
      border: 1px solid #bd849417;
      border-radius: 50%;
      animation: float 10s ease-in-out infinite alternate;
    }

    .orb.one {
      top: 12%;
      right: -120px;
    }

    .orb.two {
      bottom: 5%;
      left: -130px;
      width: 300px;
      height: 300px;
      animation-delay: -4s;
    }

    @keyframes float {
      from { transform: translateY(0) rotate(0); }
      to { transform: translateY(-22px) rotate(12deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(100% - 40px, 650px);
      margin: auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 65px 0;
    }

    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 70px;
    }

    .symbol {
      color: var(--rose);
      font-size: 17px;
    }

    .gate, .letter {
      animation: appear 1s ease both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      color: var(--rose);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 10vw, 68px);
      line-height: 1.13;
      font-weight: 500;
      margin: 0 0 22px;
    }

    h1 em {
      color: var(--rose);
      font-weight: 500;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
      max-width: 380px;
      margin-bottom: 38px;
    }

    .password-box {
      display: flex;
      max-width: 410px;
      border-bottom: 1px solid #65505a;
      align-items: center;
      padding-bottom: 12px;
      gap: 12px;
    }

    input {
      background: transparent;
      color: var(--text);
      border: none;
      outline: none;
      font: inherit;
      font-size: 14px;
      flex: 1;
      min-width: 0;
    }

    input::placeholder {
      color: #77717b;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .open-btn {
      background: none;
      border: none;
      color: var(--rose);
      font-size: 11px;
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .open-btn:hover {
      color: #f0c4d0;
    }

    .error {
      color: #d99aa9;
      font-size: 11px;
      min-height: 24px;
      margin-top: 13px;
    }

    .letter {
      display: none;
    }

    .letter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 45px;
      gap: 12px;
    }

    .letter-header span {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .section {
      margin-bottom: 43px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity .9s ease, transform .9s ease;
    }

    .section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .section h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--rose);
      margin: 0 0 18px;
    }

    .section p {
      font-size: 13px;
      line-height: 2;
      color: #d2cbd0;
      margin: 0 0 15px;
    }

    .section:nth-child(2) {
      padding: 22px;
      border-left: 1px solid var(--rose);
      background: linear-gradient(90deg, #bd84940c, transparent);
    }

    .signature {
      border-top: 1px solid var(--line);
      padding-top: 38px;
      margin-top: 55px;
      text-align: center;
      opacity: 0;
      transform: translateY(12px);
      transition: 1s ease;
    }

    .signature.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .signature h2 {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      margin: 0 0 15px;
    }

    .heart {
      color: var(--rose);
      display: inline-block;
      font-size: 26px;
      animation: heartbeat 2s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }

    .signature p {
      font-family: 'Playfair Display', serif;
      color: var(--rose);
      font-style: italic;
      font-size: 17px;
      margin-top: 15px;
    }

    .footer {
      text-align: center;
      font-size: 9px;
      letter-spacing: 3px;
      color: #77717b;
      margin-top: 65px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 480px) {
      .container {
        width: calc(100% - 42px);
        padding: 45px 0;
      }

      .topline {
        margin-bottom: 60px;
      }

      .section h2 {
        font-size: 25px;
      }

      .section p {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient">
    <div class="orb one"></div>
    <div class="orb two"></div>
  </div>

  <main class="container">

    <div class="topline">
      <span>A little letter</span>
      <span class="symbol">♡</span>
      <span>For you · Always</span>
    </div>

    <!-- PASSWORD SCREEN -->
    <section class="gate" id="gate">
      <div class="eyebrow">A little something for you</div>

      <h1>Hey,<br><em>you.</em></h1>

      <p class="description">
        I have something to tell you.
        A few words, from me to you.
      </p>

      <form id="passwordForm" class="password-box">
        <input
          type="password"
          id="password"
          placeholder="Enter your password..."
          autocomplete="off"
          required
        >
        <button class="open-btn" type="submit" id="submitBtn">
          OPEN →
        </button>
      </form>

      <div class="error" id="error"></div>
    </section>

    <!-- LETTER SCREEN -->
    <section class="letter" id="letter">
      <div class="letter-header">
        <span>Words from my heart</span>
      </div>

      <div id="letterContent"></div>

      <div class="signature" id="signature">
        <h2>Aku sayang kamu.</h2>
        <span class="heart">♡</span>
        <p>— your sweet devil</p>
      </div>

      <div class="footer">
        MADE WITH LOVE · JUST FOR YOU
      </div>
    </section>


  </main>

  <script>
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('password');
    const errorBox = document.getElementById('error');
    const submitBtn = document.getElementById('submitBtn');

    // Password untuk membuka surat.
    // Catatan: pada GitHub Pages, password ini bukan pengamanan rahasia.
    const LETTER_PASSWORD = 'seventeen';

    const sections = [
      {
        title: 'First, thank you.',
        paragraphs: [
          'Sayangkuu,',
          'Happy mensiversary sayangkuu. Terimakasih yaa atas semua cinta kamu ke aku.',
          'Makasih juga untuk segala pengertiannya kalau mungkin aku masih sering gatau harus bersikap kaya gimana dalam hubungan.',
          'Makasih udah nunjukin sayangnya kamu, perhatian kamu, pedulinya kamu.'
        ]
      },
      {
        title: "I'm proud of you.",
        paragraphs: [
          'Aku cukup amaze karna aku anggap kamu udah berusaha berubah dari yg sebelumnya (dulu) (walau kamu udah kasi tau penyebabnya).',
          'Aku juga bangga sama kamu, atas segala pencapaian yang udah kamu raih sejauh ini. Semangat yaa buat jalanin semuanya. Semoga magangnya selalu dilancarkan, selalu diberikan kesehatan, dan semoga kamu selalu punya kesabaran serta kekuatan dalam menghadapi setiap cobaan.',
          'I hope everything goes well for you.'
        ]
      },
      {
        title: "And, I'm sorry...",
        paragraphs: [
          'Maaf yaa aku masih suka cemburu berlebihan, marah2, lemot, sarkas, keras kepala, hornyan (ini gabisa dinego kayanya).',
          'Aku tau masih banyak hal di diri aku yg perlu diperbaiki lagi. Aku juga masih belajar bagaimana seharusnya menjadi pasangan yang baik.'
        ]
      },
      {
        title: 'For our future.',
        paragraphs: [
          'Aku harap, kita sama2 bisa berprogres dan belajar terus buat hubungan ini ke depannya yaa.',
          'Thankyou for being with me, for loving me, and making me feel loved.'
        ]
      }
    ];

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const password = passwordInput.value.trim();
      if (!password) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'WAIT...';
      errorBox.textContent = '';

      // Sedikit jeda agar transisi tombol tetap terasa halus.
      window.setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.textContent = 'OPEN →';

        if (password !== LETTER_PASSWORD) {
          errorBox.textContent = 'Hmm, sepertinya password-nya belum tepat. Try again ♡';
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        document.getElementById('gate').classList.add('hidden');
        const letter = document.getElementById('letter');
        letter.style.display = 'block';
        renderLetter(sections);
      }, 250);
    });

    // Render surat setelah password berhasil.
    function renderLetter(sections) {
      const content = document.getElementById('letterContent');

      sections.forEach((item, index) => {
        const section = document.createElement('article');
        section.className = 'section';

        const heading = document.createElement('h2');
        heading.textContent = item.title;
        section.appendChild(heading);

        item.paragraphs.forEach(text => {
          const p = document.createElement('p');
          p.textContent = text;
          section.appendChild(p);
        });

        content.appendChild(section);

        setTimeout(() => {
          section.classList.add('visible');
        }, 300 + index * 250);
      });

      const signature = document.getElementById('signature');

      setTimeout(() => {
        signature.classList.add('visible');
      }, 300 + sections.length * 250 + 500);
    }


  </script>
</body>
</html>
